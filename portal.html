--serif:'Newsreader',Georgia,serif;--sans:'Geist','Helvetica Neue',Arial,sans-serif;--mono:'Geist Mono',Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.mark{width:34px;height:34px;border-radius:50%;flex:none;border:1px solid var(--line);background:#fff var(--logo) no-repeat 64% 75.3%/130.1% auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:10px 14px;font-weight:500;cursor:pointer;text-decoration:none;transition:background .2s,transform .1s}
.btn:hover{background:#333}.btn:active{transform:scale(.98)}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.g:hover{background:var(--bone)}
.btn.sm{padding:6px 10px;font-size:13px}
.tag{display:inline-block;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:9999px;background:var(--bone);color:var(--soft);white-space:nowrap}
.t-red{background:var(--red-pale);color:var(--red-ink)}.t-blue{background:var(--blue-pale);color:var(--blue)}.t-green{background:var(--green-pale);color:var(--green-ink)}.t-yel{background:var(--yel-pale);color:var(--yel-ink)}
.demo{background:var(--yel-pale);color:var(--yel-ink);font:500 12px/1.4 var(--mono);text-align:center;padding:7px 12px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.02em;margin:0}
/* login */
.login{min-height:calc(100vh - 32px);display:grid;place-items:center;padding:24px 16px}
.lbox{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:18px}
.lbox h1{font-size:30px}
.roles{display:grid;gap:8px}
.role{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;background:#fff;text-align:left}
.role[aria-pressed=true]{border-color:var(--ink);background:var(--bone)}
.role b{display:block;font-weight:600}.role span{font-size:13px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--sans);background:var(--red-pale);color:var(--red-ink);flex:none}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
/* app shell */
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 32px)}
.side{border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:calc(100vh - 32px);background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;padding:0 8px 18px}
.nav{all:unset;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;color:var(--soft);cursor:pointer}
.nav:hover{background:var(--bone)}.nav[aria-current=true]{background:var(--ink);color:#fff}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-left:auto;font:500 11px/1 var(--mono);background:var(--red);color:#fff;border-radius:9999px;padding:3px 6px}
.me{margin-top:auto;border-top:1px solid var(--line);padding:14px 8px 0;display:flex;gap:10px;align-items:center;font-size:13px}
.me small{display:block;color:var(--muted)}
.main{padding:28px 32px 48px;min-width:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.top h1{font-size:34px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}.grid2>*{min-width:0}.item{flex-wrap:wrap}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.time{font:500 13px/1 var(--mono);color:var(--soft);width:48px;flex:none}
.grow{flex:1;min-width:0}
.grow b{font-weight:600}.grow p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.sec{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.wa{border-left:3px solid #25a35a}
.prow{cursor:pointer}.prow:hover b{text-decoration:underline}
.search{max-width:320px}
/* patient */
.ph{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.ph .av{width:52px;height:52px;font-size:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto;scrollbar-width:none}
.tab{all:unset;padding:10px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:10px 16px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.locked{display:flex;gap:12px;align-items:center;background:var(--bone);border:1px dashed #d8d6d0;border-radius:12px;padding:28px;color:var(--soft)}
/* odontogram */
.odo{display:flex;flex-direction:column;gap:10px;overflow-x:auto;padding-bottom:4px}
.arch{display:flex;gap:4px;justify-content:center;min-width:max-content}
.arch .mid{width:10px}
.tooth{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 10px/1 var(--mono);color:var(--muted)}
.tooth svg{width:40px;height:40px}
.tooth:focus-visible svg{outline:2px solid var(--ink);border-radius:4px}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--soft);margin-top:14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle}
.picker{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.picker button{all:unset;cursor:pointer;font-size:12.5px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
.picker button[aria-pressed=true]{border-color:var(--ink);background:var(--bone)}
/* evolutions */
.evo{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff}
.evo header{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.evo header b{font-weight:600}
.evo .meta{font:400 12px/1.4 var(--mono);color:var(--muted)}
.evo p{margin:4px 0 0}
.anx{margin-top:10px;padding:10px 12px;border-left:2px solid var(--blue);background:var(--blue-pale);border-radius:0 6px 6px 0;font-size:13.5px}
.hash{font:400 11px/1 var(--mono);color:var(--muted);margin-top:8px}
/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ph-i{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.ph-i .img{aspect-ratio:4/3;background:var(--bone) center/cover no-repeat;display:grid;place-items:center;color:var(--muted);font:500 11px/1 var(--mono)}
.ph-i div.cap{padding:8px 10px;font-size:12.5px}
.ph-i small{display:block;color:var(--muted);font:400 11px/1.4 var(--mono)}
.up{border:1px dashed #cfcdc7;border-radius:10px;display:grid;place-items:center;text-align:center;padding:16px;color:var(--soft);cursor:pointer;min-height:150px;font-size:13px}
/* table */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line)}
td{padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{text-align:right;font-family:var(--mono)}
.tot td{border-bottom:0;font-weight:600}
.audit td{font-size:13px}.audit td:first-child{font-family:var(--mono);color:var(--muted);white-space:nowrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.timeout{font:400 12px/1 var(--mono);color:var(--muted)}
/* mobile */
.tabbar{display:none}
@media (max-width:860px){
 .app{grid-template-columns:1fr}
 .side{display:none}
 .main{padding:18px 16px calc(84px + env(safe-area-inset-bottom))}
 .top h1{font-size:28px}
 .grid2{grid-template-columns:1fr}
 .kv{grid-template-columns:110px 1fr}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(251,251,250,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:20}
 .tabbar .nav{flex:1;flex-direction:column;gap:3px;font-size:11px;padding:7px 4px;justify-content:center;position:relative}
 .tabbar .nav .cnt{position:absolute;top:2px;right:calc(50% - 22px)}
 .mtop{display:flex!important}
 .search{max-width:none}
 .tooth svg{width:24px;height:24px}
 .arch{gap:2px}
}
.mtop{display:none;align-items:center;justify-content:space-between;margin-bottom:14px}
.mtop .b{display:flex;gap:8px;align-items:center;font-weight:600}
</style>
</head>
<body>
<div class="demo">DEMO · Datos de ejemplo, ningún paciente real · En producción: doble factor, datos cifrados y auditoría</div>

<!-- LOGIN -->
<section id="login" class="login">
 <form class="lbox" id="lform">
  <div style="display:flex;gap:10px;align-items:center"><span class="mark" role="img" aria-label="Logo de Maxillaria"></span><b>Maxillaria</b><span class="tag" style="margin-left:auto">Portal clínico</span></div>
  <h1>Ingresar</h1>
  <div class="roles" id="roles">
   <button type="button" class="role" data-u="dra" aria-pressed="true"><span class="av">VR</span><span><b>Dra. Valeria Ríos</b><span>Odontóloga · acceso completo</span></span></button>
   <button type="button" class="role" data-u="dr" aria-pressed="false"><span class="av" style="background:var(--blue-pale);color:var(--blue)">MP</span><span><b>Dr. Martín Paredes</b><span>Odontólogo · sus pacientes</span></span></button>
   <button type="button" class="role" data-u="rec" aria-pressed="false"><span class="av" style="background:var(--green-pale);color:var(--green-ink)">LC</span><span><b>Lucía Chávez</b><span>Recepción · sin notas clínicas</span></span></button>
  </div>
  <div><label for="code">Código de verificación (doble factor)</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="Demo: cualquier código de 6 dígitos"></div>
  <button class="btn" type="submit">Ingresar</button>
  <p class="note"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" style="flex:none;margin-top:2px"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Cada persona tiene su usuario. La sesión se cierra sola tras 15 minutos sin uso y nada clínico queda guardado en el celular.</p>
 </form>
</section>

<!-- APP -->
<div id="app" class="app" hidden>
 <aside class="side">
  <div class="brand"><span class="mark" role="img" aria-label="Logo de Maxillaria"></span>Maxillaria</div>
  <div id="navD"></div>
  <div class="me"><span class="av" id="meAv"></span><span><b id="meName"></b><small id="meRole"></small></span></div>
  <button class="nav" id="logout" style="margin-top:8px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l-5-5 5-5M5 12h11"/></svg>Cerrar sesión</button>
 </aside>
 <main class="main">
  <div class="mtop"><span class="b"><span class="mark"></span>Maxillaria</span><button class="btn g sm" id="logoutM">Salir</button></div>
  <div id="view"></div>
 </main>
 <nav class="tabbar" id="navM"></nav>
</div>

<input type="file" id="file" accept="image/*" capture="environment" hidden>

<script>
(function(){
var USERS={dra:{n:'Dra. Valeria Ríos',r:'Odontóloga',i:'VR',clin:true},dr:{n:'Dr. Martín Paredes',r:'Odontólogo',i:'MP',clin:true},rec:{n:'Lucía Chávez',r:'Recepción',i:'LC',clin:false}};
var ICON={agenda:'<path d="M7 3v3M17 3v3M4 9h16"/><rect x="4" y="5" width="16" height="16" rx="2"/>',pac:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',aud:'<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/><path d="M9 12l2 2 4-4"/>'};
var today=new Date();function d(off,h){var x=new Date(today);x.setDate(x.getDate()+off);if(h){var p=h.split(':');x.setHours(+p[0],+p[1],0,0)}return x}
function fmt(x){return x.toLocaleDateString('es-PE',{day:'2-digit',month:'short',year:'numeric'})}
function hm(x){return x.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit',hour12:false})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hash(s){var h=2166136261;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return('00000000'+(h>>>0).toString(16)).slice(-8)}

var PAC=[
 {id:'P-0142',n:'Andrea Salazar Quispe',dni:'4•••••21',edad:34,tel:'9•• ••• 318',doc:'dra',alerg:'Penicilina',motivo:'Diseño de sonrisa',idioma:'ES',
  odo:{11:'carilla',21:'carilla',16:'obturado',26:'caries',36:'endodoncia',46:'obturado'},
  evo:[{f:d(-21,'10:30'),u:'dra',t:'Valoración inicial',x:'Paciente refiere insatisfacción estética en sector anterior. Se planifica diseño de sonrisa digital y carillas de porcelana en 11 y 21.',cerr:true,anx:[]},
       {f:d(-7,'16:00'),u:'dra',t:'Preparación carillas 11 y 21',x:'Tallado mínimo, toma de impresión digital y provisionales. Sin complicaciones.',cerr:true,anx:[{f:d(-6,'09:10'),u:'dra',x:'Corrección: el color elegido es BL2, no BL3.'}]}],
  fotos:[{c:'Sonrisa inicial',f:d(-21)},{c:'Diseño digital',f:d(-14)}],
  pres:[['Diseño de sonrisa digital',1,350],['Carilla de porcelana',2,1200],['Blanqueamiento en consultorio',1,450]]},
 {id:'P-0139',n:'James Whitfield',dni:'Pasaporte •••882',edad:52,tel:'+1 ••• ••• 4410',doc:'dra',alerg:'Ninguna',motivo:'Implante pieza 36',idioma:'EN',
  odo:{36:'ausente',37:'corona',18:'ausente',28:'ausente'},
  evo:[{f:d(-10,'11:00'),u:'dra',t:'Initial assessment (EN)',x:'Missing 36. CBCT shows adequate bone width. Implant planned, no graft required. Explained in English, plan delivered in EN.',cerr:true,anx:[]}],
  fotos:[{c:'Panorámica',f:d(-10)}],pres:[['Implante dental + corona',1,3800]]},
 {id:'P-0131',n:'Rosa Huamán Torres',dni:'0•••••77',edad:61,tel:'9•• ••• 905',doc:'dr',alerg:'Hipertensa controlada',motivo:'Rehabilitación oral',idioma:'ES',
  odo:{14:'ausente',15:'ausente',24:'protesis',25:'protesis',46:'corona',47:'caries'},
  evo:[{f:d(-30,'09:00'),u:'dr',t:'Plan de rehabilitación',x:'Prótesis parcial superior y tratamiento de caries en 47. Control de presión antes de cada sesión.',cerr:true,anx:[]}],
  fotos:[],pres:[['Prótesis parcial removible',1,1500],['Obturación resina',1,180]]},
 {id:'P-0128',n:'Diego Fernández Lazo',dni:'7•••••40',edad:27,tel:'9•• ••• 662',doc:'dr',alerg:'Ninguna',motivo:'Blanqueamiento',idioma:'ES',odo:{},evo:[],fotos:[],pres:[['Blanqueamiento en consultorio',1,450]]}
];
var CITAS=[
 {h:'09:00',p:'P-0131',m:'Control de prótesis',doc:'dr',e:'confirmada'},
 {h:'10:30',p:'P-0142',m:'Cementado de carillas 11 y 21',doc:'dra',e:'confirmada'},
 {h:'12:00',p:'P-0139',m:'Implant surgery (EN)',doc:'dra',e:'confirmada'},
 {h:'16:00',p:'P-0128',m:'Blanqueamiento',doc:'dr',e:'por confirmar'}
];
var WA=[
 {n:'Carla Mendoza',m:'Quiere valoración para carillas',p:'Jueves en la tarde',t:'hace 12 min'},
 {n:'Tom Becker',m:'Toothache, asks for appointment in English',p:'Lo antes posible',t:'hace 1 h'}
];
var STATES=[['sano','Sano','#fff','#cfcdc7'],['caries','Caries','#c8162a','#c8162a'],['obturado','Obturado','#1f6c9f','#1f6c9f'],['endodoncia','Endodoncia','#1f6c9f','#1f6c9f'],['corona','Corona','#fff','#1f6c9f'],['carilla','Carilla','#e1f3fe','#1f6c9f'],['implante','Implante','#fff','#1f6c9f'],['protesis','Prótesis','#fff','#1f6c9f'],['ausente','Ausente','#fff','#787774']];
var AUD=[];var me=null,curTab='datos',curP=null,brush='caries',view='agenda',idle;

function log(a,obj){var prev=AUD.length?AUD[0].h:'00000000';var e={f:new Date(),u:me?USERS[me].n:'—',a:a,o:obj||''};e.h=hash(prev+e.f.toISOString()+e.u+a+e.o);AUD.unshift(e)}
function toast(t){var x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(function(){x.remove()},2400)}
function P(id){return PAC.filter(function(p){return p.id===id})[0]}
function canSee(p){return me==='dra'||(me==='dr'&&p.doc==='dr')}
function initials(n){return n.split(' ').slice(0,2).map(function(w){return w[0]}).join('')}

/* login */
var sel='dra';
[].forEach.call(document.querySelectorAll('.role'),function(b){b.onclick=function(){sel=b.dataset.u;[].forEach.call(document.querySelectorAll('.role'),function(x){x.setAttribute('aria-pressed',x===b)})}});
document.getElementById('lform').onsubmit=function(e){e.preventDefault();var c=document.getElementById('code').value.trim();if(!/^\d{6}$/.test(c)){toast('Ingresa un código de 6 dígitos');return}
 me=sel;log('Inicio de sesión con doble factor');document.getElementById('login').hidden=true;document.getElementById('app').hidden=false;
 document.getElementById('meAv').textContent=USERS[me].i;document.getElementById('meName').textContent=USERS[me].n;document.getElementById('meRole').textContent=USERS[me].r;go('agenda');resetIdle()};
function logout(msg){if(me)log(msg||'Cierre de sesión');me=null;document.getElementById('app').hidden=true;document.getElementById('login').hidden=false;document.getElementById('code').value='';clearTimeout(idle);if(msg)toast(msg)}
document.getElementById('logout').onclick=function(){logout()};document.getElementById('logoutM').onclick=function(){logout()};
function resetIdle(){clearTimeout(idle);idle=setTimeout(function(){logout('Sesión cerrada por 15 min sin uso')},15*60*1000)}
['click','keydown','touchstart'].forEach(function(ev){document.addEventListener(ev,function(){if(me)resetIdle()},{passive:true})});

/* nav */
function navHTML(){var items=[['agenda','Agenda',WA.length],['pac','Pacientes',0],['aud','Auditoría',0]];
 if(me==='rec')items=items.filter(function(i){return i[0]!=='aud'});
 return items.map(function(i){return '<button class="nav" data-v="'+i[0]+'" aria-current="'+(view===i[0]||(view==='pat'&&i[0]==='pac'))+'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+ICON[i[0]]+'</svg>'+i[1]+(i[2]?'<span class="cnt">'+i[2]+'</span>':'')+'</button>'}).join('')}
function renderNav(){['navD','navM'].forEach(function(id){var el=document.getElementById(id);el.innerHTML=navHTML();[].forEach.call(el.querySelectorAll('.nav'),function(b){b.onclick=function(){go(b.dataset.v)}})})}
function go(v,id){view=v;if(id)curP=id;renderNav();var V=document.getElementById('view');V.innerHTML=({agenda:agenda,pac:pacientes,aud:auditoria,pat:paciente})[v]();bind(v);window.scrollTo(0,0)}

/* views */
function agenda(){var mine=CITAS.filter(function(c){return me==='rec'||me==='dra'||c.doc===me});
 return '<div class="top"><div><h1>Agenda de hoy</h1><div class="sub">'+today.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'})+'</div></div><span class="timeout">Sesión segura · cierre automático 15 min</span></div>'+
 '<div class="grid2"><div class="card"><p class="sec">Citas</p><div class="list">'+mine.map(function(c){var p=P(c.p);return '<div class="item prow" data-p="'+p.id+'"><span class="time">'+c.h+'</span><span class="av">'+initials(p.n)+'</span><span class="grow"><b>'+esc(p.n)+'</b><p>'+esc(c.m)+' · '+USERS[c.doc].n+'</p></span><span class="tag '+(c.e==='confirmada'?'t-green':'t-yel')+'">'+c.e+'</span>'+(p.idioma==='EN'?'<span class="tag t-blue">EN</span>':'')+'</div>'}).join('')+'</div></div>'+
 '<div class="card"><p class="sec">Solicitudes desde WhatsApp · asistente Maxi</p><div class="list" id="walist">'+(WA.length?WA.map(function(w,i){return '<div class="item wa" style="padding-left:12px"><span class="grow"><b>'+esc(w.n)+'</b><p>'+esc(w.m)+'</p><p>Prefiere: '+esc(w.p)+' · '+w.t+'</p></span><button class="btn sm" data-wa="'+i+'">Agendar</button></div>'}).join(''):'<p class="sub">Sin solicitudes pendientes.</p>')+'</div>'+
 '<p class="note" style="margin-top:12px">El asistente solo crea solicitudes de cita. Nunca accede a historias clínicas.</p></div></div>'}
function pacientes(){return '<div class="top"><div><h1>Pacientes</h1><div class="sub">'+PAC.length+' registrados</div></div><button class="btn" id="newp">+ Paciente</button></div>'+
 '<div class="card"><input class="search" id="q" placeholder="Buscar por nombre o código" aria-label="Buscar paciente"><div class="list" id="plist" style="margin-top:8px">'+plist('')+'</div></div>'}
function plist(q){return PAC.filter(function(p){return (p.n+p.id).toLowerCase().indexOf(q.toLowerCase())>=0}).map(function(p){return '<div class="item prow" data-p="'+p.id+'"><span class="av">'+initials(p.n)+'</span><span class="grow"><b>'+esc(p.n)+'</b><p>'+p.id+' · '+esc(p.motivo)+' · '+USERS[p.doc].n+'</p></span>'+(p.idioma==='EN'?'<span class="tag t-blue">EN</span>':'')+(p.alerg!=='Ninguna'?'<span class="tag t-red">Alerta</span>':'')+'</div>'}).join('')}
function paciente(){var p=P(curP);var tabs=[['datos','Datos'],['odo','Odontograma'],['evo','Evolución'],['fotos','Fotos y Rx'],['pres','Presupuesto']];
 return '<button class="btn g sm" id="back" style="margin-bottom:16px">← Pacientes</button><div class="ph"><span class="av">'+initials(p.n)+'</span><div><h1 style="font-size:30px">'+esc(p.n)+'</h1><div class="sub">'+p.id+' · '+p.edad+' años · '+USERS[p.doc].n+'</div></div>'+(p.alerg!=='Ninguna'?'<span class="tag t-red">Alerta: '+esc(p.alerg)+'</span>':'')+(p.idioma==='EN'?'<span class="tag t-blue">Atención en inglés</span>':'')+'</div>'+
 '<div class="tabs" role="tablist">'+tabs.map(function(t){return '<button class="tab" role="tab" data-t="'+t[0]+'" aria-selected="'+(curTab===t[0])+'">'+t[1]+'</button>'}).join('')+'</div><div id="tabc">'+tabBody(p)+'</div>'}
function lockMsg(){return '<div class="locked"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><div><b>Información clínica restringida</b><br>'+(me==='rec'?'Recepción ve datos de contacto, citas y presupuestos, no notas clínicas.':'Este paciente pertenece a otro profesional.')+' El intento quedó registrado en la auditoría.</div></div>'}
function tabBody(p){var clin=USERS[me].clin&&canSee(p);
 if(curTab==='datos')return '<div class="card"><div class="kv"><span>Documento</span><span>'+p.dni+'</span><span>Teléfono</span><span>'+p.tel+'</span><span>Idioma</span><span>'+(p.idioma==='EN'?'Inglés':'Español')+'</span><span>Motivo</span><span>'+esc(p.motivo)+'</span><span>Alergias / alertas</span><span>'+esc(p.alerg)+'</span><span>Consentimientos</span><span><span class="tag t-green">Datos personales ✓</span> <span class="tag t-green">Tratamiento ✓</span></span></div></div><p class="note" style="margin-top:12px">Documento y teléfono enmascarados. Los datos de identidad se guardan separados de los clínicos.</p>';
 if(curTab==='pres')return presupuesto(p);
 if(!clin){log('Acceso bloqueado a '+({odo:'odontograma',evo:'evolución',fotos:'fotos'})[curTab],p.id);return lockMsg()}
 if(curTab==='odo'){log('Vio odontograma',p.id);return odontograma(p)}
 if(curTab==='evo'){log('Vio evolución clínica',p.id);return evolucion(p)}
 if(curTab==='fotos'){log('Vio fotos y radiografías',p.id);return fotos(p)}}
function toothSVG(st){var s=STATES.filter(function(x){return x[0]===st})[0]||STATES[0];var extra='';
 if(st==='ausente')extra='<path d="M4 4l22 22M26 4L4 26" stroke="#787774" stroke-width="2.4"/>';
 if(st==='corona')extra='<circle cx="15" cy="15" r="12.5" fill="none" stroke="#1f6c9f" stroke-width="2.4"/>';
 if(st==='implante')extra='<path d="M15 6v18M10 10h10M11 15h8M12 20h6" stroke="#1f6c9f" stroke-width="2"/>';
 if(st==='endodoncia')extra='<path d="M15 3v24" stroke="#fff" stroke-width="2"/>';
 if(st==='protesis')extra='<path d="M3 15h24" stroke="#1f6c9f" stroke-width="2.4"/>';
 return '<svg viewBox="0 0 30 30"><rect x="5" y="5" width="20" height="20" rx="4" fill="'+s[2]+'" stroke="'+s[3]+'" stroke-width="1.6"/>'+extra+'</svg>'}
function odontograma(p){var up=[18,17,16,15,14,13,12,11,0,21,22,23,24,25,26,27,28],lo=[48,47,46,45,44,43,42,41,0,31,32,33,34,35,36,37,38];
 function row(a,top){return '<div class="arch">'+a.map(function(n){if(!n)return '<span class="mid"></span>';var t='<button class="tooth" data-n="'+n+'" aria-label="Pieza '+n+': '+(p.odo[n]||'sano')+'">'+(top?n:'')+toothSVG(p.odo[n]||'sano')+(top?'':n)+'</button>';return t}).join('')+'</div>'}
 return '<div class="card"><p class="sec">Odontograma · notación FDI · NTS 188-MINSA</p><div class="odo">'+row(up,true)+row(lo,false)+'</div>'+
 '<p class="sub" style="margin-top:14px">Elige un hallazgo y toca la pieza:</p><div class="picker">'+STATES.map(function(s){return '<button data-b="'+s[0]+'" aria-pressed="'+(brush===s[0])+'">'+s[1]+'</button>'}).join('')+'</div>'+
 '<div class="legend"><span><i style="background:#c8162a"></i>Rojo: por tratar</span><span><i style="background:#1f6c9f"></i>Azul: tratamiento realizado</span></div></div>'}
function evolucion(p){return '<div class="card" style="margin-bottom:14px"><p class="sec">Nueva atención</p><input id="et" placeholder="Título (ej. Control post operatorio)" style="margin-bottom:8px"><textarea id="ex" rows="3" placeholder="Hallazgos, procedimiento, indicaciones"></textarea><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap"><span class="note">Al cerrar, la atención queda sellada: no se edita, solo se agregan anexos.</span><button class="btn" id="eadd">Cerrar y firmar atención</button></div></div>'+
 (p.evo.length?p.evo.slice().reverse().map(function(e,ri){var i=p.evo.length-1-ri;return '<div class="evo"><header><b>'+esc(e.t)+'</b><span class="tag t-green">Cerrada</span></header><div class="meta">'+fmt(e.f)+' '+hm(e.f)+' · '+USERS[e.u].n+'</div><p>'+esc(e.x)+'</p>'+e.anx.map(function(a){return '<div class="anx"><b>Anexo</b> · '+fmt(a.f)+' · '+USERS[a.u].n+'<br>'+esc(a.x)+'</div>'}).join('')+'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;flex-wrap:wrap"><span class="hash">huella '+hash(e.t+e.x+e.f.toISOString())+'</span><button class="btn g sm" data-anx="'+i+'">+ Anexo</button></div></div>'}).join(''):'<p class="sub">Sin atenciones registradas.</p>')}
function fotos(p){return '<div class="photos"><label class="up" id="upl"><span><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h3l2-3h6l2 3h3v13H4z"/><circle cx="12" cy="13" r="4"/></svg><br>Subir foto o radiografía<br><small style="color:var(--muted)">Desde la cámara del celular</small></span></label>'+
 p.fotos.map(function(f){return '<div class="ph-i"><div class="img" style="'+(f.src?'background-image:url('+f.src+')':'')+'">'+(f.src?'':'IMAGEN DE EJEMPLO')+'</div><div class="cap">'+esc(f.c)+'<small>'+fmt(f.f)+' · cifrada</small></div></div>'}).join('')+'</div><p class="note" style="margin-top:12px">En producción las imágenes se guardan cifradas y solo se abren con enlaces que expiran en 5 minutos.</p>'}
function presupuesto(p){var t=0;return '<div class="card" style="overflow-x:auto"><table><thead><tr><th>Tratamiento</th><th style="text-align:right">Cant.</th><th style="text-align:right">Precio S/</th><th style="text-align:right">Subtotal</th></tr></thead><tbody>'+p.pres.map(function(r){var s=r[1]*r[2];t+=s;return '<tr><td>'+esc(r[0])+'</td><td class="n">'+r[1]+'</td><td class="n">'+r[2].toLocaleString('es-PE')+'</td><td class="n">'+s.toLocaleString('es-PE')+'</td></tr>'}).join('')+'<tr class="tot"><td colspan="3">Total (precios de ejemplo)</td><td class="n">S/ '+t.toLocaleString('es-PE')+'</td></tr></tbody></table><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px"><button class="btn g sm" data-act="Presupuesto enviado por WhatsApp">Enviar por WhatsApp</button><button class="btn g sm" data-act="Boleta electrónica emitida (demo SUNAT)">Emitir boleta SUNAT</button>'+(p.idioma==='EN'?'<button class="btn g sm" data-act="Budget exported in English (PDF)">PDF en inglés</button>':'')+'</div></div>'}
function auditoria(){return '<div class="top"><div><h1>Auditoría</h1><div class="sub">Quién vio o cambió qué y cuándo. Cada registro se encadena con el anterior: si alguien lo altera, se nota.</div></div></div><div class="card" style="overflow-x:auto"><table class="audit"><thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Paciente</th><th>Huella</th></tr></thead><tbody>'+AUD.map(function(e){return '<tr><td>'+hm(e.f)+'</td><td>'+esc(e.u)+'</td><td>'+esc(e.a)+'</td><td>'+esc(e.o)+'</td><td style="font-family:var(--mono);color:var(--muted)">'+e.h+'</td></tr>'}).join('')+'</tbody></table></div>'}

/* bindings */
function bind(v){var V=document.getElementById('view');
 [].forEach.call(V.querySelectorAll('.prow'),function(r){r.onclick=function(){curTab='datos';log('Abrió ficha',r.dataset.p);go('pat',r.dataset.p)}});
 [].forEach.call(V.querySelectorAll('[data-wa]'),function(b){b.onclick=function(){var w=WA.splice(+b.dataset.wa,1)[0];log('Agendó solicitud de WhatsApp',w.n);toast('Cita pendiente creada para '+w.n);go('agenda')}});
 var q=document.getElementById('q');if(q)q.oninput=function(){document.getElementById('plist').innerHTML=plist(q.value);bind('pac')};
 var np=document.getElementById('newp');if(np)np.onclick=function(){toast('Demo: aquí se abre el registro con consentimiento de datos')};
 if(v==='pat'){document.getElementById('back').onclick=function(){go('pac')};
  [].forEach.call(V.querySelectorAll('.tab'),function(t){t.onclick=function(){curTab=t.dataset.t;go('pat')}});bindTab()}}
function bindTab(){var p=P(curP),V=document.getElementById('tabc');
 [].forEach.call(V.querySelectorAll('[data-b]'),function(b){b.onclick=function(){brush=b.dataset.b;[].forEach.call(V.querySelectorAll('[data-b]'),function(x){x.setAttribute('aria-pressed',x===b)})}});
 [].forEach.call(V.querySelectorAll('.tooth'),function(t){t.onclick=function(){var n=t.dataset.n;if(brush==='sano')delete p.odo[n];else p.odo[n]=brush;log('Odontograma: pieza '+n+' → '+brush,p.id);var s=window.scrollY;document.getElementById('tabc').innerHTML=odontograma(p);bindTab();window.scrollTo(0,s)}});
 var ea=document.getElementById('eadd');if(ea)ea.onclick=function(){var t=document.getElementById('et').value.trim(),x=document.getElementById('ex').value.trim();if(!t||!x){toast('Completa título y detalle');return}p.evo.push({f:new Date(),u:me,t:t,x:x,cerr:true,anx:[]});log('Cerró atención: '+t,p.id);toast('Atención cerrada y sellada');go('pat')};
 [].forEach.call(V.querySelectorAll('[data-anx]'),function(b){b.onclick=function(){var x=prompt('Texto del anexo (corrección o ampliación):');if(!x)return;p.evo[+b.dataset.anx].anx.push({f:new Date(),u:me,x:x});log('Agregó anexo a una atención',p.id);go('pat')}});
 var up=document.getElementById('upl');if(up)up.onclick=function(e){e.preventDefault();var f=document.getElementById('file');f.onchange=function(){var file=f.files[0];if(!file)return;var r=new FileReader();r.onload=function(){p.fotos.unshift({c:file.name.replace(/\.[^.]+$/,'').slice(0,40)||'Foto clínica',f:new Date(),src:r.result});log('Subió imagen clínica',p.id);toast('Imagen subida (demo: no sale de este navegador)');go('pat')};r.readAsDataURL(file);f.value=''};f.click()};
 [].forEach.call(V.querySelectorAll('[data-act]'),function(b){b.onclick=function(){log(b.dataset.act,p.id);toast(b.dataset.act)}})}
})();
</script>
</body>
</html>
